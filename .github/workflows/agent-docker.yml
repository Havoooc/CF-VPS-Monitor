name: Publish cf-probe container image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Build binaries
        working-directory: agent
        env:
          GOOS: linux
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          VERSION="${{ github.event.release.tag_name || github.sha }}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/cf-probe-linux-amd64 ./cmd/cf-probe
          GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/cf-probe-linux-arm64 ./cmd/cf-probe
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/havoooc/cf-vps-monitor
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,format=long
      - uses: docker/build-push-action@v5
        with:
          context: ./agent
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
